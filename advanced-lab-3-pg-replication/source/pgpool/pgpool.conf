# ----------------------------
# ОСНОВНЫЕ НАСТРОЙКИ
# ----------------------------
listen_addresses = '*'
port = 9999

# ----------------------------
# РЕЖИМ РАБОТЫ КЛАСТЕРА
# ----------------------------
# Основной режим - стриминг репликация
backend_clustering_mode = 'streaming_replication'

# ОПИСАНИЕ НАШИХ НОД (из вашего docker-compose.yml)
backend_hostname0 = 'primary'
backend_port0 = 5432
backend_weight0 = 1          # Вес для балансировки (можно сделать реплику "тяжелее")
backend_flag0 = 'ALWAYS_PRIMARY|ALLOW_TO_FAILOVER' # Всегда считать главной нодой

backend_hostname1 = 'standby'
backend_port1 = 5432
backend_weight1 = 1          # Вес для балансировки
backend_flag1 = 'ALLOW_TO_FAILOVER'  # Эту ноду можно повысить до мастера

# ----------------------------
# БАЛАНСИРОВКА НАГРУЗКИ (ВАШ ОСНОВНОЙ ЗАПРОС)
# ----------------------------
load_balance_mode = on
# Это ключевой параметр: при появлении запроса на запись в транзакции,
# все последующие SELECT'ы в этой же транзакции пойдут на мастер.
# Это безопасно, так как реплика может еще не иметь этих данных.
disable_load_balance_on_write = 'transaction'

# ----------------------------
# HEALTH CHECK (ДЛЯ FAILOVER)
# ----------------------------
health_check_period = 5        # Проверять каждые 5 секунд
health_check_timeout = 20      # Таймаут проверки
health_check_user = 'postgres'
health_check_password = 'postgres'
health_check_max_retries = 3   # Сколько раз повторить перед объявлением сбоя

# ----------------------------
# НАСТРОЙКИ FAILOVER И FAILBACK (АВТОМАТИЗАЦИЯ)
# ----------------------------
# Скрипт, который выполнится при сбое мастер-ноды.
failover_command = '/scripts/failover.sh %d %H %m %M %P'
# Скрипт, который выполнится для возвращения ноды в строй как реплики.
failover_command = '/usr/local/bin/pgpool-scripts/failover.sh %d %H %m %M %P'
# Автоматически переключаться обратно на оригинальный мастер, когда он появится.
auto_failback = on
# Пользователь для выполнения онлайн-восстановления (через pg_rewind)
recovery_user = 'postgres'
recovery_password = 'postgres'
recovery_1st_stage_command = '' # Базовая настройка - пусто
